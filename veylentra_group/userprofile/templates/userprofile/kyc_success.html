<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Update Success - Veylentra Group</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    body {
      background: #07111f;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Subtle background glow */
    body::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: 
        radial-gradient(circle at 30% 70%, rgba(201, 168, 92, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 70% 30%, rgba(201, 168, 92, 0.04) 0%, transparent 50%);
      z-index: 0;
      animation: backgroundFloat 20s ease-in-out infinite alternate;
    }

    @keyframes backgroundFloat {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(2%, -2%) rotate(2deg); }
    }

    .success-box {
      background: rgba(13, 27, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    /* Gold accent top border */
    .success-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, #c9a85c, #e2b95e, #a98237, #c9a85c);
      background-size: 300% 100%;
      animation: shimmer 4s ease-in-out infinite;
      z-index: 2;
    }

    @keyframes shimmer {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 0%; }
      100% { background-position: 0% 0%; }
    }

    /* Veylentra Logo */
    .logo-container {
      margin-bottom: 20px;
    }

    .logo-container svg {
      width: 48px;
      height: 48px;
      margin: 0 auto;
      display: block;
      color: #c9a85c;
    }

    .logo-container .logo-text {
      display: block;
      margin-top: 6px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: #f8fafc;
    }

    .logo-container .logo-text span {
      color: #c9a85c;
      letter-spacing: 0.46em;
      font-size: 8px;
      display: block;
      margin-top: 2px;
    }

    .success-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 2px solid rgba(52, 211, 153, 0.3);
      background: rgba(52, 211, 153, 0.08);
      color: #34d399;
      font-size: 36px;
    }

    .success-icon i {
      font-size: 36px;
    }

    .success-icon.pulse {
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.2);
      }
      70% {
        box-shadow: 0 0 0 15px rgba(52, 211, 153, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(52, 211, 153, 0);
      }
    }

    h4 {
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: 12px;
      color: #34d399;
      letter-spacing: -0.02em;
    }

    .message {
      color: #94a3b8;
      margin-bottom: 20px;
      font-size: 1rem;
      line-height: 1.6;
    }

    .username-highlight {
      color: #c9a85c;
      font-weight: 600;
    }

    .verification-note {
      background: rgba(201, 168, 92, 0.06);
      border-radius: 12px;
      padding: 16px 20px;
      margin: 20px 0 25px;
      border-left: 3px solid #c9a85c;
      text-align: left;
    }

    .verification-note p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin: 0;
    }

    .verification-note i {
      color: #c9a85c;
      margin-right: 10px;
    }

    .btn-dashboard {
      background: linear-gradient(135deg, #c9a85c 0%, #e2b95e 100%);
      color: #07111f;
      border: none;
      font-weight: 700;
      border-radius: 8px;
      padding: 12px 32px;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(201, 168, 92, 0.15);
      font-size: 0.9rem;
      letter-spacing: 0.03em;
    }

    .btn-dashboard i {
      margin-right: 10px;
    }

    .btn-dashboard:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(201, 168, 92, 0.3);
      color: #07111f;
    }

    .support-link {
      color: #94a3b8;
      text-decoration: none;
      transition: all 0.3s ease;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      font-size: 0.85rem;
    }

    .support-link:hover {
      color: #c9a85c;
      border-bottom-color: #c9a85c;
    }

    @media (max-width: 480px) {
      .success-box {
        padding: 32px 24px;
      }

      .success-icon {
        width: 64px;
        height: 64px;
        font-size: 28px;
      }

      .success-icon i {
        font-size: 28px;
      }

      h4 {
        font-size: 1.5rem;
      }

      .btn-dashboard {
        padding: 10px 24px;
        font-size: 0.85rem;
      }

      .logo-container svg {
        width: 38px;
        height: 38px;
      }

      .verification-note {
        padding: 14px 16px;
      }
    }

    @media (max-width: 360px) {
      .success-box {
        padding: 24px 16px;
      }

      h4 {
        font-size: 1.3rem;
      }

      .message {
        font-size: 0.9rem;
      }
    }
  </style>
</head>

<body>

  <div class="success-box">
    <!-- Veylentra Logo -->
    <div class="logo-container">
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M6 11 17 7l7 9-7 2-6 8-5-15Z" stroke="currentColor" stroke-width="3" />
        <path d="m21 8 7 6-5 20-8-7 6-19Z" fill="currentColor" opacity=".95" />
        <path d="m28 13 13-6-4 20-9 8-7-7 7-15Z" stroke="currentColor" stroke-width="3" />
      </svg>
      <span class="logo-text">
        VEY LENTRA
        <span>GROUP</span>
      </span>
    </div>

    <!-- Success Icon -->
    <div class="success-icon pulse">
      <i class="fas fa-check-circle"></i>
    </div>

    <h4>Profile Updated Successfully!</h4>

    <p class="message">
      Hi <strong class="username-highlight">{{ username }}</strong>, your profile has been updated successfully.
    </p>

    <div class="verification-note">
      <p>
        <i class="fas fa-clock"></i>
        We'll review your information and notify you once verification is complete.
      </p>
    </div>

    <a href="{% url 'userprofile:dashboard' %}" class="btn-dashboard">
      <i class="fas fa-home"></i> Go to Dashboard
    </a>

    <p style="margin-top: 18px; font-size: 0.8rem; color: #64748b;">
      Need help? <a href="mailto:support@veylentragroup.com" class="support-link">Contact Support</a>
    </p>
  </div>

  <!-- 🌍 Auto Detect + Remember + Translate -->
  <div id="google_translate_element" style="display:none;"></div>

  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        autoDisplay: false
      }, 'google_translate_element');

      setTimeout(() => {
        const supportedLangs = ['en','es','fr','de','it','pt','ru','zh-CN','ja','ar'];
        let userLang = localStorage.getItem('userLang');

        if (!userLang) {
          userLang = (navigator.language || 'en').split('-')[0];
          if (!supportedLangs.includes(userLang)) userLang = 'en';
        }

        const select = document.querySelector('select.goog-te-combo');
        if (select && userLang !== 'en') {
          select.value = userLang;
          select.dispatchEvent(new Event('change'));
        }

        if (select) {
          select.addEventListener('change', () => {
            localStorage.setItem('userLang', select.value);
          });
        }
      }, 1000);
    }
  </script>

  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
