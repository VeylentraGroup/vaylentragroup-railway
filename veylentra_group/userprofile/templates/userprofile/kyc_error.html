<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Update Error - Veylentra Group</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    body {
      background: #07111f;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .error-box {
      background: rgba(13, 27, 42, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 16px;
      padding: 48px 36px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .error-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 2px solid rgba(248, 113, 113, 0.3);
      background: rgba(248, 113, 113, 0.08);
      color: #f87171;
      font-size: 36px;
    }

    .error-icon i {
      font-size: 36px;
    }

    h4 {
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: 12px;
      color: #f87171;
      letter-spacing: -0.02em;
    }

    .error-message {
      color: #94a3b8;
      margin-bottom: 8px;
      font-size: 1rem;
    }

    .text-muted {
      color: #64748b !important;
      font-size: 0.9rem;
      margin-bottom: 25px;
    }

    .btn-home {
      background: linear-gradient(135deg, #c9a85c 0%, #e2b95e 100%);
      color: #07111f;
      border: none;
      font-weight: 700;
      border-radius: 8px;
      padding: 12px 30px;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
      font-size: 0.9rem;
      letter-spacing: 0.03em;
      box-shadow: 0 4px 20px rgba(201, 168, 92, 0.15);
    }

    .btn-home i {
      margin-right: 8px;
    }

    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(201, 168, 92, 0.3);
      color: #07111f;
    }

    /* Veylentra Logo in header */
    .logo-container {
      margin-bottom: 25px;
    }

    .logo-container svg {
      width: 48px;
      height: 48px;
      color: #c9a85c;
    }

    .logo-container .logo-text {
      display: block;
      margin-top: 8px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: #f8fafc;
    }

    .logo-container .logo-text span {
      color: #c9a85c;
      letter-spacing: 0.46em;
      font-size: 8px;
      display: block;
      margin-top: 2px;
    }

    /* Support link */
    .support-link {
      color: #94a3b8;
      text-decoration: none;
      transition: all 0.3s ease;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      font-size: 0.85rem;
    }

    .support-link:hover {
      color: #c9a85c;
      border-bottom-color: #c9a85c;
    }

    @media (max-width: 480px) {
      .error-box {
        padding: 32px 20px;
      }

      .error-icon {
        width: 64px;
        height: 64px;
        font-size: 28px;
      }

      .error-icon i {
        font-size: 28px;
      }

      h4 {
        font-size: 1.4rem;
      }

      .btn-home {
        padding: 10px 24px;
        font-size: 0.85rem;
      }

      .logo-container svg {
        width: 38px;
        height: 38px;
      }
    }

    @media (max-width: 360px) {
      .error-box {
        padding: 24px 16px;
      }

      h4 {
        font-size: 1.2rem;
      }
    }
  </style>
</head>

<body>

  <div class="error-box">
    <!-- Veylentra Logo -->
    <div class="logo-container">
      <svg viewBox="0 0 48 48" fill="none" style="margin:0 auto; display:block;">
        <path d="M6 11 17 7l7 9-7 2-6 8-5-15Z" stroke="currentColor" stroke-width="3" />
        <path d="m21 8 7 6-5 20-8-7 6-19Z" fill="currentColor" opacity=".95" />
        <path d="m28 13 13-6-4 20-9 8-7-7 7-15Z" stroke="currentColor" stroke-width="3" />
      </svg>
      <span class="logo-text">
        VEY LENTRA
        <span>GROUP</span>
      </span>
    </div>

    <!-- Error Icon -->
    <div class="error-icon">
      <i class="fas fa-exclamation-triangle"></i>
    </div>

    <h4>Profile Update Failed</h4>
    <p class="error-message">We encountered an issue while updating your profile.</p>
    <p class="text-muted">Please try again later or contact support if the problem persists.</p>

    <!-- Button -->
    <a href="{% url 'userprofile:dashboard' %}" class="btn-home">
      <i class="fas fa-arrow-left"></i> Back to Dashboard
    </a>

    <p style="margin-top: 20px; font-size: 0.8rem; color: #64748b;">
      Need help? <a href="mailto:support@veylentragroup.com" class="support-link">Contact Support</a>
    </p>
  </div>

  <!-- 🌍 Auto Detect + Remember + Translate -->
  <div id="google_translate_element" style="display:none;"></div>

  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        autoDisplay: false
      }, 'google_translate_element');

      setTimeout(() => {
        const supportedLangs = ['en','es','fr','de','it','pt','ru','zh-CN','ja','ar'];
        let userLang = localStorage.getItem('userLang');

        if (!userLang) {
          userLang = (navigator.language || navigator.userLanguage || 'en').split('-')[0];
          if (!supportedLangs.includes(userLang)) userLang = 'en';
        }

        const select = document.querySelector('select.goog-te-combo');

        if (select && userLang !== 'en') {
          select.value = userLang;
          select.dispatchEvent(new Event('change'));
        }

        if (select) {
          select.addEventListener('change', () => {
            localStorage.setItem('userLang', select.value);
          });
        }
      }, 1000);
    }
  </script>

  <!-- Google Translate -->
  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
