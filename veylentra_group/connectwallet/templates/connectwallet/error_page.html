<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error - Veylentra Group</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: #07111f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Poppins', sans-serif;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
    }

    .error-box {
      background: rgba(13, 27, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 45px 40px 40px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(148, 163, 184, 0.12);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    /* Gold accent top border */
    .error-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, #c9a85c, #e2b95e, #a98237, #c9a85c);
      background-size: 300% 100%;
      animation: shimmer 4s ease-in-out infinite;
    }

    @keyframes shimmer {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 0%; }
      100% { background-position: 0% 0%; }
    }

    /* Veylentra Logo */
    .logo-container {
      margin-bottom: 20px;
    }

    .logo-container svg {
      width: 48px;
      height: 48px;
      color: #c9a85c;
    }

    .logo-container .brand-text {
      display: block;
      margin-top: 6px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: #f8fafc;
    }

    .logo-container .brand-text span {
      color: #c9a85c;
      letter-spacing: 0.46em;
      font-size: 8px;
      display: block;
      margin-top: 2px;
    }

    .error-icon {
      font-size: 48px;
      color: #f87171;
      background: rgba(248, 113, 113, 0.08);
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      margin: 0 auto 20px;
      border: 2px solid rgba(248, 113, 113, 0.15);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .error-box h4 {
      font-weight: 700;
      font-size: 1.5rem;
      margin-bottom: 12px;
      color: #f87171;
      letter-spacing: -0.02em;
    }

    .error-message {
      color: #94a3b8;
      margin-bottom: 8px;
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .error-box p.text-muted {
      color: #64748b !important;
      font-size: 0.9rem;
      margin-bottom: 25px;
    }

    .btn-home {
      background: linear-gradient(135deg, #c9a85c 0%, #e2b95e 100%);
      color: #07111f !important;
      border: none;
      font-weight: 700;
      border-radius: 8px;
      padding: 12px 28px;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
      box-shadow: 0 4px 20px rgba(201, 168, 92, 0.15);
    }

    .btn-home:hover {
      background: linear-gradient(135deg, #dbb45c 0%, #e8c86a 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(201, 168, 92, 0.3);
      color: #07111f !important;
    }

    .support-link {
      color: #94a3b8;
      text-decoration: none;
      transition: all 0.3s ease;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      font-size: 0.85rem;
    }

    .support-link:hover {
      color: #c9a85c;
      border-bottom-color: #c9a85c;
    }

    @media (max-width: 480px) {
      .error-box {
        padding: 30px 20px;
      }

      .error-icon {
        width: 64px;
        height: 64px;
        font-size: 38px;
      }

      .error-box h4 {
        font-size: 1.3rem;
      }

      .btn-home {
        padding: 10px 22px;
        font-size: 0.85rem;
      }

      .logo-container svg {
        width: 40px;
        height: 40px;
      }

      .logo-container .brand-text {
        font-size: 12px;
      }
    }

    @media (max-width: 360px) {
      .error-box {
        padding: 24px 16px;
      }

      .error-box h4 {
        font-size: 1.1rem;
      }

      .error-message {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <div class="error-box">
    
    <!-- Veylentra Logo -->
    <div class="logo-container">
      <svg viewBox="0 0 48 48" fill="none" style="margin:0 auto; display:block;">
        <path d="M6 11 17 7l7 9-7 2-6 8-5-15Z" stroke="currentColor" stroke-width="3" />
        <path d="m21 8 7 6-5 20-8-7 6-19Z" fill="currentColor" opacity=".95" />
        <path d="m28 13 13-6-4 20-9 8-7-7 7-15Z" stroke="currentColor" stroke-width="3" />
      </svg>
      <span class="brand-text">
        VEY LENTRA
        <span>GROUP</span>
      </span>
    </div>

    <!-- Error Icon -->
    <div class="error-icon">
      <i class="fas fa-exclamation-triangle"></i>
    </div>

    <h4>An Error Occurred</h4>
    <p class="error-message">{{ error_message|default:"Something went wrong. Please try again later." }}</p>
    <p class="text-muted">
      If this issue persists, please contact  
      <a href="mailto:support@veylentragroup.com" class="support-link">support@veylentragroup.com</a>
    </p>

    <a href="{% url 'select_wallet' %}" class="btn-home">
      <i class="fas fa-arrow-left"></i> Go Back
    </a>
  </div>

</body>
</html>
